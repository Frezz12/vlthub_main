name: Build & Release VLTHub

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pkg-config: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

          - platform: windows-latest
            target: x86_64-pc-windows-msvc

          - platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.pkg-config }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm --filter @pjasaver/desktop run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: List bundle contents (debug)
        if: always()
        run: |
          echo "=== Bundle dir ==="
          ls -la apps/desktop/src-tauri/target/release/bundle/ || echo "No bundle dir"
          echo "=== Recursive ==="
          find apps/desktop/src-tauri/target/release/bundle/ -type f 2>/dev/null || echo "No files"

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: apps/desktop/src-tauri/target/release/bundle/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: bundles
          merge-multiple: true

      - name: List downloaded bundles (debug)
        if: always()
        run: |
          echo "=== bundles/ contents ==="
          find bundles/ -type f 2>/dev/null || echo "No files found"
          echo "=== tree ==="
          ls -laR bundles/ 2>/dev/null || echo "No bundles dir"

      - name: Generate latest.json
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          BASE_URL="https://github.com/Frezz12/vlthub_main/releases/download/$GITHUB_REF_NAME"
          PUB_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          echo '{}' > latest.json
          jq --arg v "$VERSION"     '.version = $v'       latest.json > tmp && mv tmp latest.json
          jq --arg n "Release $GITHUB_REF_NAME" '.notes = $n' latest.json > tmp && mv tmp latest.json
          jq --arg d "$PUB_DATE"    '.pub_date = $d'      latest.json > tmp && mv tmp latest.json

          if [ -d bundles ]; then
            for dir in bundles/*/; do
              [ -d "$dir" ] || continue
              dirname="$(basename "$dir")"

              case "$dirname" in
                deb|AppImage|appimage) target="linux-x86_64" ;;
                msi|nsis|wix)          target="windows-x86_64" ;;
                dmg|macos)             target="darwin-aarch64" ;;
                *) continue ;;
              esac

              bundle=$(find "$dir" -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.msi' -o -name '*.exe' -o -name '*.zip' -o -name '*.dmg' \) 2>/dev/null | head -1)

              if [ -z "$bundle" ]; then
                echo "::warning::No bundle file found in $dir"
                ls -la "$dir" >&2
                continue
              fi

              sig="${bundle}.sig"
              if [ ! -f "$sig" ]; then
                echo "::warning::No .sig file for $(basename "$bundle")"
                continue
              fi

              SIGNATURE=$(cat "$sig")
              BUNDLE_NAME=$(basename "$bundle")
              URL="$BASE_URL/$BUNDLE_NAME"

              jq \
                --arg t "$target" \
                --arg sig "$SIGNATURE" \
                --arg url "$URL" \
                '.platforms[$t] = {signature: $sig, url: $url}' \
                latest.json > tmp && mv tmp latest.json
            done
          else
            echo "::warning::bundles/ directory does not exist"
          fi

          jq . latest.json > /dev/null && echo "latest.json is valid"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VLTHub ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            bundles/**/*.msi
            bundles/**/*.exe
            bundles/**/*.zip
            bundles/**/*.dmg
            bundles/**/*.AppImage
            bundles/**/*.deb
            bundles/**/*.rpm
            bundles/**/*.sig
            latest.json
