name: Build & Release VLTHub

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

          - platform: macos-latest
            target: aarch64-apple-darwin

          - platform: macos-13
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.pkg-config }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm --filter @pjasaver/desktop run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Sign bundles (updater .sig files)
        shell: bash
        run: |
          BUNDLE_DIR="apps/desktop/src-tauri/target/release/bundle"
          KEY="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          PASS="${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"

          echo "=== Checking signing env ==="
          echo "KEY length: ${#KEY}"
          echo "PASS length: ${#PASS}"

          if [ -z "$KEY" ] || [ -z "$PASS" ]; then
            echo "::warning::Signing key or password not set — skipping manual signing"
            exit 0
          fi

          echo "=== Signing bundles ==="
          find "$BUNDLE_DIR" -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.zip' -o -name '*.tar.gz' \) | while read -r file; do
            sig="${file}.sig"
            if [ -f "$sig" ]; then
              echo "Already signed: $(basename "$file")"
              continue
            fi
            echo "Signing: $(basename "$file")"
            TAURI_SIGNING_PRIVATE_KEY="$KEY" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$PASS" \
              npx @tauri-apps/cli signer sign "$file" 2>&1 || echo "::warning::Failed to sign $(basename "$file")"
          done

          echo "=== .sig files generated ==="
          find "$BUNDLE_DIR" -name '*.sig' -type f

      - name: List bundle contents (debug)
        if: always()
        shell: bash
        run: |
          echo "=== Bundle dir ==="
          find apps/desktop/src-tauri/target/release/bundle/ -type f 2>/dev/null || echo "No files"

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: apps/desktop/src-tauri/target/release/bundle/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: bundles
          merge-multiple: true

      - name: List downloaded bundles (debug)
        if: always()
        shell: bash
        run: |
          echo "=== bundles/ contents ==="
          find bundles/ -type f 2>/dev/null || echo "No files found"
          ls -la bundles/ 2>/dev/null || echo "No bundles dir"

      - name: Generate latest.json
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          BASE_URL="https://github.com/Frezz12/vlthub_main/releases/download/$GITHUB_REF_NAME"
          PUB_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          echo '{}' > latest.json
          jq --arg v "$VERSION"     '.version = $v'       latest.json > tmp && mv tmp latest.json
          jq --arg n "Release $GITHUB_REF_NAME" '.notes = $n' latest.json > tmp && mv tmp latest.json
          jq --arg d "$PUB_DATE"    '.pub_date = $d'      latest.json > tmp && mv tmp latest.json

          if [ ! -d bundles ]; then
            echo "::warning::bundles/ directory does not exist"
            jq . latest.json > /dev/null
            exit 0
          fi

          # Determine platform key(s) from a filename.
          # Prints lines: "platform_key|url|sig_file"
          # First line = primary key, subsequent lines = suffixed variants.
          classify_file() {
            local name; name=$(basename "$1")
            local fpath="$1"

            # macOS aarch64 updater artifact (Apple Silicon) — highest priority
            if echo "$name" | grep -qiE 'aarch64.*\.tar\.gz'; then
              echo "darwin-aarch64|$BASE_URL/$name|${fpath}.sig"
              echo "darwin-aarch64-app|$BASE_URL/$name|${fpath}.sig"
              return
            fi
            # macOS x86_64 updater artifact (Intel)
            if echo "$name" | grep -qiE 'x64.*\.tar\.gz'; then
              echo "darwin-x86_64|$BASE_URL/$name|${fpath}.sig"
              echo "darwin-x86_64-app|$BASE_URL/$name|${fpath}.sig"
              return
            fi
            # Windows MSI
            if echo "$name" | grep -qiE '\.msi$'; then
              echo "windows-x86_64|$BASE_URL/$name|${fpath}.sig"
              echo "windows-x86_64-msi|$BASE_URL/$name|${fpath}.sig"
              return
            fi
            # Windows NSIS installer
            if echo "$name" | grep -qiE '(^|[^a-z])setup\.exe$' || echo "$name" | grep -qiE '\-setup\.exe$'; then
              echo "windows-x86_64|$BASE_URL/$name|${fpath}.sig"
              echo "windows-x86_64-nsis|$BASE_URL/$name|${fpath}.sig"
              return
            fi
            # macOS DMG (fallback)
            if echo "$name" | grep -qiE 'aarch64.*\.dmg$'; then
              echo "darwin-aarch64|$BASE_URL/$name|${fpath}.sig"
              return
            fi
            if echo "$name" | grep -qiE 'x64.*\.dmg$'; then
              echo "darwin-x86_64|$BASE_URL/$name|${fpath}.sig"
              return
            fi
            # Linux AppImage
            if echo "$name" | grep -qiE '\.AppImage$'; then
              echo "linux-x86_64|$BASE_URL/$name|${fpath}.sig"
              echo "linux-x86_64-appimage|$BASE_URL/$name|${fpath}.sig"
              return
            fi
            # Linux deb
            if echo "$name" | grep -qiE '\.deb$'; then
              echo "linux-x86_64|$BASE_URL/$name|${fpath}.sig"
              echo "linux-x86_64-deb|$BASE_URL/$name|${fpath}.sig"
              return
            fi
            # Linux rpm
            if echo "$name" | grep -qiE '\.rpm$'; then
              echo "linux-x86_64|$BASE_URL/$name|${fpath}.sig"
              echo "linux-x86_64-rpm|$BASE_URL/$name|${fpath}.sig"
              return
            fi
          }

          # Collect all candidate records: platform_key|url|sig_path
          all_records=""
          primary_seen=""

          while IFS= read -r -d '' file; do
            sig="${file}.sig"
            [ -f "$sig" ] || { echo "::warning::Missing .sig for $(basename "$file")"; continue; }

            mapfile -t recs < <(classify_file "$file")
            [ ${#recs[@]} -eq 0 ] && { echo "::debug::Unrecognised file: $(basename "$file")"; continue; }

            first_key="${recs[0]%%|*}"
            # Skip if primary platform already has a bundle (first match wins)
            if echo "$primary_seen" | grep -qiE "(^| )${first_key}( |$)"; then
              echo "Skipping $(basename "$file") — $first_key already assigned"
              continue
            fi

            for rec in "${recs[@]}"; do
              key="${rec%%|*}"
              if [ "$key" = "$first_key" ]; then
                primary_seen="$primary_seen $first_key"
              fi
              all_records="$all_records"$'\n'"$rec"
            done
          done < <(find bundles/ -maxdepth 1 -type f ! -name '*.sig' -print0)

          # Write records into latest.json (primary key first, then suffixed)
          while IFS='|' read -r key url sig_path; do
            [ -z "$key" ] && continue
            signature=$(cat "$sig_path")
            jq \
              --arg t "$key" \
              --arg sig "$signature" \
              --arg url "$url" \
              '.platforms[$t] = {signature: $sig, url: $url}' \
              latest.json > tmp && mv tmp latest.json
          done <<< "$all_records"

          jq . latest.json > /dev/null && echo "latest.json is valid and complete"
          echo "=== Generated latest.json ==="
          cat latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VLTHub ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            bundles/**/*.msi
            bundles/**/*.exe
            bundles/**/*.zip
            bundles/**/*.dmg
            bundles/**/*.AppImage
            bundles/**/*.deb
            bundles/**/*.rpm
            bundles/**/*.tar.gz
            bundles/**/*.sig
            latest.json
