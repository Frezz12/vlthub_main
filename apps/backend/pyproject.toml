[project]
name = "pjasaver-backend"
version = "0.1.0"
description = "VLTHub backend"
requires-python = ">=3.9"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.4.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "redis>=5.1.0",
    "rq>=1.16.0",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
    "python-magic>=0.4.27",
    "psycopg2-binary>=2.9.0",
]

[tool.setuptools]
packages = ["app", "app.core", "app.models", "app.schemas", "app.services", "app.tasks", "app.api", "app.api.v1"]

[tool.setuptools.package-data]
app = ["py.typed"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
