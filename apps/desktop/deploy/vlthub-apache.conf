<VirtualHost *:80>
    ServerName vlthub.ru

    DocumentRoot /var/www/vlthub

    <Directory /var/www/vlthub>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # MIME-типы для файлов скачивания
    AddType application/octet-stream .msi .dmg .AppImage

    # SPA — все не-файловые пути отдаём index.html
    FallbackResource /index.html

    # Прокси на бэкенд
    ProxyPreserveHost On

    # Исключения — Apache раздаёт сам
    ProxyPass /downloads/ !

    # Прокси — только API и файлы
    ProxyPass /api/ http://127.0.0.1:8000/api/
    ProxyPassReverse /api/ http://127.0.0.1:8000/api/

    ProxyPass /uploads/ http://127.0.0.1:8000/uploads/
    ProxyPassReverse /uploads/ http://127.0.0.1:8000/uploads/

    # Реальный IP клиента для бэкенда
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"

    ErrorLog ${APACHE_LOG_DIR}/vlthub_error.log
    CustomLog ${APACHE_LOG_DIR}/vlthub_access.log combined
</VirtualHost>
