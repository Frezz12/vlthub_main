services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pjasaver
      POSTGRES_USER: pjasaver
      POSTGRES_PASSWORD: pjasaver
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build: ./apps/backend
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://pjasaver:pjasaver@postgres:5432/pjasaver
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
      - ./apps/backend:/app

  worker:
    build: ./apps/backend
    command: rq worker high default low --url redis://redis:6379
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://pjasaver:pjasaver@postgres:5432/pjasaver
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads:/app/uploads
      - ./apps/backend:/app

volumes:
  pgdata:
  redisdata:
  uploads:
