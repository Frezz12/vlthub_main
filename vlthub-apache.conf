<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName vlthub.ru
    DocumentRoot /var/www/vlthub

    <Directory /var/www/vlthub>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Прокси для API
    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8000/api/
    ProxyPassReverse /api/ http://127.0.0.1:8000/api/
    ProxyPass /uploads/ http://127.0.0.1:8000/uploads/
    ProxyPassReverse /uploads/ http://127.0.0.1:8000/uploads/

    RewriteEngine On

    # Не трогаем API, uploads и существующие файлы
    RewriteRule ^/api/ - [L]
    RewriteRule ^/uploads/ - [L]
    RewriteCond %{REQUEST_FILENAME} -f
    RewriteRule ^ - [L]

    # Deep link для VLTHub
    RewriteCond %{HTTP_USER_AGENT} "VLTHub" [NC]
    RewriteRule ^/shared/(.+)$ vlthub://shared/$1 [R=302,L]

    # SPA — всё остальное на index.html
    RewriteRule ^ /index.html [L]

    # SSL
    SSLCertificateFile /etc/letsencrypt/live/vlthub.ru/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/vlthub.ru/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
